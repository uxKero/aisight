[package]
name = "aisight"
version = "0.1.0"
description = "Capturas directo al chat de tus agentes"
authors = ["uxKero"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "aisight_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = ["tray-icon", "protocol-asset", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
windows-core = "0.61"
windows-collections = "0.2"
windows-future = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
arboard = { version = "3", features = ["image-data"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
uiautomation = "0.22"

[dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Threading",
  "Win32_System_DataExchange",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_UI_Shell",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_Storage_Xps",
  "Win32_System_Com",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Graphics",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Foundation",
  "Foundation_Collections",
  "ApplicationModel_DataTransfer",
  "Storage",
  "Storage_Streams",
]

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
